      font-weight: 450;

      cursor: pointer;
      outline: none;

      background: #dce6f2;

    }
    .stats span {
      font-weight: 700;
      color: #00337a;
    }

      background: white;

    }

      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 500;
      color: #00337a;

      text-overflow: ellipsis;
    }

      font-weight: 500;
      color: #142b44;
    }
    .vol-name.empty {
      color: #8a9db0;
      font-style: italic;
    }

      text-align: center;
      width: 70px;
    }

      height: 20px;
      accent-color: #1a6fb0;
      cursor: pointer;

    }

,,,Наука и аспиранты,волонтер,Лукашов Владислав Эдуардович,FALSE,
,,,Дети 7+,волонтер,Альперович Мария Кирилловна,FALSE,
,,,Дети 7+,волонтер,Богданова Анна Павловна,FALSE,
,,,Дети 7+,волонтер,Румянцев Григорий Андреевич,FALSE,
,,,Дети 7+,волонтер,Кудряшова Варвара Константиновна,FALSE,
,,,Дети 7+,волонтер,Акулинина Светлана Борисовна,FALSE,
,,,Зона питания,волонтер,Смоленцева Ирина Георгиевна,FALSE,
,,,Зона питания,волонтер,Леванова Елена Александровна,FALSE,
,,,Резерв,волонтер,Правдина Нина Борисовна,FALSE,
,,,Резерв,волонтер,Слета Варвара Евгеньевна,FALSE,
,,,Резерв,волонтер,Тосина Маргарита Анатольевна,FALSE,
,,,Резерв,волонтер,Мацкова Мария Борисовна,FALSE,
,,,Резерв,волонтер,Кубаева Радмила Раймировна,FALSE,
,,,Резерв,волонтер,Терзинов Максим,FALSE,
,,,Резерв,волонтер,Смирнова Екатерина Яновна,FALSE,
,,,Резерв,волонтер,Стрелина Мария Алексеевна,FALSE,
,,,,координатор,Бердичевский Артем Сергеевич,FALSE,`;

    // ----- парсим -----
    function parseCSV(text) {
      const lines = text.split(/\r?\n/).filter(line => line.trim() !== '');
      const header = lines[0].split(',').map(c => c.trim());
      const data = [];
      let currentTime = '';
      for (let i = 1; i < lines.length; i++) {
        let parts = lines[i].split(',').map(c => c.trim());
        // если первый столбец не пустой — обновляем время
        if (parts[0] && parts[0] !== '') {
          currentTime = parts[0];
        }
        // зона: parts[3], статус: parts[4], фио: parts[5], явка: parts[6], коммент: parts[7] 
        const zone = parts[3] || '';
        const status = parts[4] || '';
        let name = parts[5] || '';
        const attendance = parts[6] || 'FALSE';
        const comment = parts[7] || '';
        // если имя пустое, но есть комментарий "серебро" — оставляем пустым
        data.push({
          time: currentTime,
          zone: zone,
          status: status,
          name: name,
          attendance: attendance.toUpperCase() === 'TRUE',
          comment: comment
        });
      }
      return data;
    }

    let volunteerData = parseCSV(rawCSV);
    // генерация уникальных id (по индексу)
    volunteerData.forEach((item, idx) => item._id = idx);

    // ---------- состояние ----------
    let currentData = [...volunteerData];
    let timeFilter = 'all';
    let zoneFilter = 'all';

    // DOM
    const tbody = document.getElementById('tableBody');
    const timeSelect = document.getElementById('timeFilter');
    const zoneSelect = document.getElementById('zoneFilter');
    const totalSpan = document.getElementById('totalCount');
    const servedSpan = document.getElementById('servedCount');
    const toastEl = document.getElementById('saveToast');

    // уникальные времена и зоны
    function populateFilters() {
      const times = [...new Set(volunteerData.map(d => d.time).filter(t => t))];
      const zones = [...new Set(volunteerData.map(d => d.zone).filter(z => z))];
      timeSelect.innerHTML = '<option value="all">Все слоты</option>' + times.map(t => `<option value="${t}">${t}</option>`).join('');
      zoneSelect.innerHTML = '<option value="all">Все зоны</option>' + zones.sort().map(z => `<option value="${z}">${z}</option>`).join('');
    }

    function render() {
      const filtered = currentData.filter(row => {
        if (timeFilter !== 'all' && row.time !== timeFilter) return false;
        if (zoneFilter !== 'all' && row.zone !== zoneFilter) return false;
        return true;
      });

      totalSpan.textContent = filtered.length;
      const served = filtered.filter(r => r.attendance).length;
      servedSpan.textContent = served;

      if (filtered.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; padding:32px; color:#6b7f94;">Нет данных по выбранным фильтрам</td></tr>`;
        return;
      }

      let html = '';
      for (let row of filtered) {
        const nameDisplay = row.name ? row.name : '—';
        const statusClass = row.status === 'координатор' ? 'coordinator' : 'volunteer';
        html += `<tr>
          <td><span style="font-weight:450; font-size:0.8rem;">${row.time || '—'}</span></td>
          <td><span class="zone-badge">${row.zone || '—'}</span></td>
          <td><span class="vol-name ${row.name ? '' : 'empty'}">${nameDisplay}</span></td>
          <td><span class="status-badge ${statusClass}">${row.status || '—'}</span></td>
          <td class="checkbox-cell">
            <input type="checkbox" data-id="${row._id}" ${row.attendance ? 'checked' : ''}>
          </td>
          <td><input class="comment-field" type="text" data-id="${row._id}" value="${row.comment || ''}" placeholder="комментарий"></td>
        </tr>`;
      }
      tbody.innerHTML = html;

      // привязываем обработчики
      document.querySelectorAll('.checkbox-cell input[type="checkbox"]').forEach(cb => {
        cb.addEventListener('change', function(e) {
          const id = parseInt(this.dataset.id);
          const row = currentData.find(d => d._id === id);
          if (row) {
            row.attendance = this.checked;
            updateStats();
            saveToLocalStorage();
            showToast('Отметка обновлена');
          }
        });
      });

      document.querySelectorAll('.comment-field').forEach(inp => {
        inp.addEventListener('change', function(e) {
          const id = parseInt(this.dataset.id);
          const row = currentData.find(d => d._id === id);
          if (row) {
            row.comment = this.value;
            saveToLocalStorage();
            showToast('Комментарий сохранён');
          }
        });
      });
    }

    function updateStats() {
      const filtered = currentData.filter(row => {
        if (timeFilter !== 'all' && row.time !== timeFilter) return false;
        if (zoneFilter !== 'all' && row.zone !== zoneFilter) return false;
        return true;
      });
      totalSpan.textContent = filtered.length;
      servedSpan.textContent = filtered.filter(r => r.attendance).length;
    }

    // local storage
    function saveToLocalStorage() {
      try {
        const store = currentData.map(({ _id, time, zone, status, name, attendance, comment }) => ({
          _id, time, zone, status, name, attendance, comment
        }));
        localStorage.setItem('ifd_lunch_data', JSON.stringify(store));
      } catch (e) {}
    }

    function loadFromLocalStorage() {
      try {
        const stored = localStorage.getItem('ifd_lunch_data');
        if (stored) {
          const parsed = JSON.parse(stored);
          if (Array.isArray(parsed) && parsed.length > 0) {
            // merge по _id
            const idMap = new Map();
            currentData.forEach(d => idMap.set(d._id, d));
            parsed.forEach(p => {
              if (idMap.has(p._id)) {
                const target = idMap.get(p._id);
                target.attendance = p.attendance;
                target.comment = p.comment || '';
              }
            });
          }
        }
      } catch (e) {}
    }

    function showToast(msg) {
      toastEl.textContent = msg || '✅ Сохранено';
      toastEl.classList.add('show');
      clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1800);
    }

    // сброс отметок
    function resetAll() {
      if (!confirm('Сбросить все отметки о выдаче обеда?')) return;
      currentData.forEach(d => { d.attendance = false; });
      render();
      saveToLocalStorage();
      showToast('Отметки сброшены');
    }

    // экспорт CSV
    function exportCSV() {
      const header = ['ВРЕМЯ ОБЕДА','Зона','Статус','ФИО','Явка','Комментарий'];
      const rows = currentData.map(d => [
        d.time || '',
        d.zone || '',
        d.status || '',
        d.name || '',
        d.attendance ? 'TRUE' : 'FALSE',
        d.comment || ''
      ]);
      const csvContent = [header.join(','), ...rows.map(r => r.join(','))].join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = 'IFD26_pitanie.csv';
      link.click();
      showToast('CSV скачан');
    }

    // фильтры
    timeSelect.addEventListener('change', function() {
      timeFilter = this.value;
      render();
    });
    zoneSelect.addEventListener('change', function() {
      zoneFilter = this.value;
      render();
    });

    document.getElementById('resetAllBtn').addEventListener('click', resetAll);
    document.getElementById('exportCSVBtn').addEventListener('click', exportCSV);

    // инициализация
    populateFilters();
    loadFromLocalStorage();
    render();

    // автосохранение при изменении
    window.addEventListener('beforeunload', function() {
      saveToLocalStorage();
    });

  })();
</script>
</body>
</html>
